<div class="row">
    <div class="col-md-12">
        <div class="card mt-4">
            <div [ngClass]="{
            'isprdAvailable' : !mobobj.isAvailable
        }" class="card-body">
                <div class="row">
                    <div class="col-md-4 d-flex flex-column justify-content-between">
                        <div class="img-container">
                            <img *ngIf="mobobj.image; else noimg" [src]="mobobj.image" [alt]="mobobj.name"
                                [title]="mobobj.name" class="w-100">

                            <ng-template class="noimg" #noimg>
                                <p>No Image</p>
                            </ng-template>
                        </div>
                        <div class="mt-3 d-flex justify-content-between">
                            <button [disabled]="!mobobj.isAvailable" class="btn btn-outline-warning">Add to
                                Cart</button>
                            <button [disabled]="!mobobj.isAvailable" class="btn btn-outline-primary">Buy Now</button>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h2>
                            {{mobobj.name}}
                            <small class="badge" [ngClass]="{
                                'badge-success' : mobobj.rating >=4,
                                'badge-warning' : mobobj.rating < 4 && mobobj.rating >= 3,
                                'badge-danger' : mobobj.rating < 3
                            }">{{mobobj.rating}}</small>
                        </h2>
                        <h4>Feactures</h4>
                        <ul class="list-group list-group-flush">
                            <li *ngFor="let feacture of mobobj.features" class="list-group-item">
                                <h3>{{feacture}}</h3>
                            </li>
                        </ul>
                    </div>
                    <div class="col-md-2">
                        <h3>
                            {{mobobj.price - mobobj.price * .15 | currency: 'INR'}}
                            <br>
                            <small>
                                <del>
                                    {{mobobj.price | currency: 'INR'}}
                                </del>
                            </small>
                        </h3>
                        <strong *ngIf="mobobj.noOfItems < 10" class="text-success">
                            Onlt {{mobobj.noOfItems}} Left !!!
                        </strong>
                    </div>
                </div>
            </div>
            <p *ngIf="!mobobj.isAvailable" class="text-danger isNotAvailable">
                Product Is Not Availabla!!!
            </p>
        </div>
    </div>
</div>
