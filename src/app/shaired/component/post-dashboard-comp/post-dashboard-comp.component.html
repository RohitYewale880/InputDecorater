<h1 class="text-center mt-5 text-primary">POST TASK</h1>
  <div class="container pt-5">
    <div class="row" *ngIf="postArr.length > 0; else noposts">
      <div class="col-md-4 mt-4" *ngFor="let post of postArr; trackBy: trackByfun">
        <app-post-comp [post]="post"></app-post-comp>
      </div>
    </div>

    <ng-template #noposts>
      <div class="alert alert-info">No post is added yet!!!</div>
    </ng-template>
  </div>
